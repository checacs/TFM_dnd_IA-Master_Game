server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy de la REST de la API (y de sus estáticos /maps y /music, que ui-web
  # pide con el mismo prefijo /api -- ver assetUrl en src/api/client.ts).
  # La barra final de proxy_pass quita el prefijo: /api/games -> http://api:3000/games
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Un turno del DM-IA (p.ej. la escena inicial) puede tardar minutos con
    # reintentos incluidos -- sin esto nginx cortaría a los 60 s.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 2m;
  }

  # SPA: cualquier ruta de React Router (/game/ABC123, /admin/users...) sirve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
